<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>KAVA SOUND｜小節タイミング登録</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--text:#f5fbff;--muted:#9eb7cc;--accent:#58e5ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1f4777,transparent 34%),radial-gradient(circle at 90% 0,#54265d,transparent 34%),var(--bg);font-family:"Yu Gothic",system-ui,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}.app{width:min(980px,100%);margin:auto;padding:12px}.eyebrow{margin:0;color:#9ecff2;font-size:.72rem;letter-spacing:.16em}
h1{margin:3px 0 4px;font-size:clamp(1.5rem,5vw,2.35rem)}.lead{margin:0 0 12px;color:#b8cede;line-height:1.6}
.card{background:linear-gradient(155deg,#0e223aef,#09192cef);border:1px solid #ffffff1c;border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}label{font-size:.8rem;color:var(--muted)}
select,input[type=number]{width:100%;background:#071a2d;color:white;border:1px solid #ffffff25;border-radius:10px;padding:10px}
.controls{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center}.controls button,.smallbtn{border:1px solid #ffffff25;background:#163451;color:white;border-radius:11px;padding:10px 12px}
.primary{background:linear-gradient(135deg,#00b8dc,#695cff)!important;font-weight:900}.seek{width:100%;accent-color:var(--accent)}.time{font-variant-numeric:tabular-nums;min-width:105px;text-align:right}
.measureBox{display:grid;grid-template-columns:150px 1fr;gap:12px}.measureNow{display:grid;place-items:center;border-radius:16px;background:#091b2d;border:1px solid #ffffff1c;padding:12px}
.measureNow .n{font-size:3.6rem;font-weight:900;line-height:1}.measureNow .t{font-size:.78rem;color:var(--muted);margin-top:6px}.markArea{display:grid;gap:8px}
.markBtn{min-height:110px;border:0;border-radius:18px;background:linear-gradient(135deg,#00a9cc,#6757e8);color:white;font-size:clamp(1.35rem,5vw,2.2rem);font-weight:900}
.help{color:#b7cada;font-size:.78rem;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#071a2d;border:1px solid #ffffff16;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.25rem}.stat span{font-size:.72rem;color:var(--muted)}.tableWrap{overflow:auto;max-height:420px;border:1px solid #ffffff18;border-radius:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:9px 10px;border-bottom:1px solid #ffffff10;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#10263e;color:#bcd0df;font-size:.78rem}td input{width:110px!important;padding:6px 7px!important}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #ffffff24;background:#153450;color:white;border-radius:11px;padding:10px 12px}.actions .good{background:#1f6646}.actions .danger{background:#6f2739}
.notice{background:#2a2414;border:1px solid #ffd36b33;color:#ffe8aa;border-radius:11px;padding:9px 11px;font-size:.78rem;line-height:1.55}kbd{background:#071a2d;border:1px solid #ffffff25;border-bottom-width:2px;border-radius:6px;padding:2px 6px}
@media(max-width:650px){.controls{grid-template-columns:auto auto 1fr}.time{grid-column:1/-1;text-align:center}.measureBox{grid-template-columns:1fr}.measureNow{grid-template-columns:auto auto;justify-content:center;gap:10px}.measureNow .n{font-size:2.5rem}}
</style>
</head>
<body>
<main class="app" id="timingApp">
<p class="eyebrow">KAVA SOUND / TEACHER TOOL</p><h1>小節タイミング登録</h1>
<p class="lead">曲を聴きながら、小節の頭で「ここ！」を押すだけ。記録はこの端末に自動保存されます。</p>

<section class="card"><div class="row">
<div class="grow"><label for="source">基準音源</label><select id="source"><option value="chorus">合唱</option><option value="accompaniment">伴奏のみ</option><option value="soprano">ソプラノのみ</option><option value="alto">アルトのみ</option><option value="tenor">男声のみ</option></select></div>
<div style="width:120px"><label for="startMeasure">開始小節</label><input id="startMeasure" type="number" min="1" max="999" value="1"></div>
<div style="width:120px"><label for="nextMeasureInput">次に打つ小節</label><input id="nextMeasureInput" type="number" min="1" max="999" value="1"></div>
</div></section>

<section class="card"><div class="controls"><button id="back5" type="button">−5秒</button><button id="play" type="button" class="primary">▶ 再生</button><input id="seek" class="seek" type="range" min="0" max="275.043" step="0.01" value="0"><span class="time" id="time">0:00.00 / 4:35.04</span></div></section>

<section class="card"><div class="measureBox">
<div class="measureNow"><div class="n" id="nextMeasure">1</div><div class="t">次に記録する小節</div></div>
<div class="markArea"><button type="button" id="mark" class="markBtn">ここ！<br><span style="font-size:.45em;font-weight:700">この瞬間が小節の頭</span></button>
<div class="help">PC：<kbd>Space</kbd> / <kbd>Enter</kbd> で記録　<kbd>P</kbd> で再生/一時停止　<kbd>Backspace</kbd> で1つ戻す</div></div>
</div></section>

<section class="card"><div class="stats"><div class="stat"><b id="count">0</b><span>記録済み</span></div><div class="stat"><b id="lastMeasure">−</b><span>最後の小節</span></div><div class="stat"><b id="lastTime">−</b><span>最後の時刻</span></div></div></section>

<section class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><strong>記録一覧</strong><span class="help">時刻はあとから直接修正できます</span></div>
<div class="tableWrap"><table><thead><tr><th>小節</th><th>開始時刻</th><th>秒</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></section>

<section class="card"><div class="actions">
<button type="button" id="undo">↩ 1つ戻す</button><button type="button" id="jumpLast">最後の記録へ移動</button><button type="button" id="exportCsv" class="good">CSV出力</button><button type="button" id="exportJson" class="good">JSON出力</button><button type="button" id="showText">プレーンテキスト表示</button><button type="button" id="reset" class="danger">全部リセット</button>
</div><div class="notice" style="margin-top:10px">トップ画面からリンクしない「隠しページ」想定です。URLを知っている人だけ開けます。検索エンジンにも登録しない設定を入れています。</div></section>

<section class="card" id="plainCard" hidden><div class="row" style="justify-content:space-between;margin-bottom:8px"><strong>そのままChatGPTに送れる形式</strong><button type="button" id="hidePlain" class="smallbtn">閉じる</button></div>
<textarea id="plain" style="width:100%;min-height:220px;background:#06172a;color:white;border:1px solid #ffffff22;border-radius:11px;padding:10px"></textarea></section>
</main>
<script>
(()=>{
const root=document.getElementById("timingApp"),$=s=>root.querySelector(s);
const paths={chorus:"../audio/chorus.mp3",accompaniment:"../audio_sep/accompaniment_only.mp3",soprano:"../audio_sep/soprano_only.mp3",alto:"../audio_sep/alto_only.mp3",tenor:"../audio_sep/tenor_only.mp3"};
const audio=new Audio(paths.chorus),KEY="kava_sound_measure_timings_v1";let marks=[];
try{marks=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(marks))marks=[]}catch(e){marks=[]}
const fmt=t=>{t=Math.max(0,Number(t)||0);const m=Math.floor(t/60),s=t-m*60;return `${m}:${s.toFixed(2).padStart(5,"0")}`};
const save=()=>localStorage.setItem(KEY,JSON.stringify(marks));
function nextMeasure(){return Math.max(1,parseInt($("#nextMeasureInput").value||"1",10))}
function syncNext(){const start=Math.max(1,parseInt($("#startMeasure").value||"1",10));const n=marks.length?Math.max(...marks.map(x=>x.measure))+1:start;$("#nextMeasureInput").value=n;$("#nextMeasure").textContent=n}
function render(){marks.sort((a,b)=>a.measure-b.measure);$("#tbody").innerHTML="";marks.forEach((m,i)=>{const tr=document.createElement("tr"),a=document.createElement("td"),b=document.createElement("td"),c=document.createElement("td"),d=document.createElement("td");a.textContent=m.measure;b.textContent=fmt(m.time);const inp=document.createElement("input");inp.type="number";inp.step="0.01";inp.min="0";inp.value=Number(m.time).toFixed(2);inp.addEventListener("change",()=>{m.time=Math.max(0,Number(inp.value)||0);save();render()});c.appendChild(inp);const del=document.createElement("button");del.type="button";del.className="smallbtn";del.textContent="削除";del.addEventListener("click",()=>{marks.splice(i,1);save();render();syncNext()});d.appendChild(del);tr.append(a,b,c,d);$("#tbody").appendChild(tr)});$("#count").textContent=marks.length;if(marks.length){const last=marks[marks.length-1];$("#lastMeasure").textContent=last.measure;$("#lastTime").textContent=fmt(last.time)}else{$("#lastMeasure").textContent="−";$("#lastTime").textContent="−"}}
function markNow(){const m=nextMeasure(),t=audio.currentTime||0,idx=marks.findIndex(x=>x.measure===m);if(idx>=0)marks[idx]={measure:m,time:t};else marks.push({measure:m,time:t});save();render();$("#nextMeasureInput").value=m+1;$("#nextMeasure").textContent=m+1}
function undo(){if(!marks.length)return;marks.sort((a,b)=>a.measure-b.measure);const last=marks.pop();save();render();$("#nextMeasureInput").value=last.measure;$("#nextMeasure").textContent=last.measure;audio.currentTime=Math.max(0,last.time-1.2)}
function toggle(){if(audio.paused)audio.play().then(()=>$("#play").textContent="❚❚ 一時停止").catch(()=>{});else{audio.pause();$("#play").textContent="▶ 再生"}}
function dl(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$("#source").addEventListener("change",()=>{const t=audio.currentTime,was=!audio.paused;audio.pause();audio.src=paths[$("#source").value];audio.currentTime=t;if(was)audio.play().catch(()=>{})});
$("#play").addEventListener("click",toggle);$("#back5").addEventListener("click",()=>audio.currentTime=Math.max(0,audio.currentTime-5));$("#seek").addEventListener("input",()=>audio.currentTime=Number($("#seek").value)||0);$("#mark").addEventListener("click",markNow);$("#undo").addEventListener("click",undo);
$("#jumpLast").addEventListener("click",()=>{if(marks.length){const x=[...marks].sort((a,b)=>a.measure-b.measure).at(-1);audio.currentTime=Math.max(0,x.time-1)}});
$("#startMeasure").addEventListener("change",()=>{if(!marks.length){$("#nextMeasureInput").value=Math.max(1,parseInt($("#startMeasure").value||"1",10));$("#nextMeasure").textContent=$("#nextMeasureInput").value}});
$("#nextMeasureInput").addEventListener("input",()=>$("#nextMeasure").textContent=Math.max(1,parseInt($("#nextMeasureInput").value||"1",10)));
$("#exportCsv").addEventListener("click",()=>dl("KAVA_SOUND_measure_timings.csv",["measure,start_seconds,start_time",...marks.sort((a,b)=>a.measure-b.measure).map(x=>`${x.measure},${Number(x.time).toFixed(3)},${fmt(x.time)}`)].join("\n"),"text/csv;charset=utf-8"));
$("#exportJson").addEventListener("click",()=>dl("KAVA_SOUND_measure_timings.json",JSON.stringify({version:1,source:$("#source").value,marks:marks.sort((a,b)=>a.measure-b.measure)},null,2),"application/json"));
$("#showText").addEventListener("click",()=>{$("#plain").value=marks.sort((a,b)=>a.measure-b.measure).map(x=>`${x.measure}小節\t${Number(x.time).toFixed(2)}秒\t${fmt(x.time)}`).join("\n");$("#plainCard").hidden=false;$("#plain").focus();$("#plain").select()});
$("#hidePlain").addEventListener("click",()=>$("#plainCard").hidden=true);$("#reset").addEventListener("click",()=>{if(confirm("記録した小節タイミングを全部消しますか？")){marks=[];save();render();syncNext()}});
root.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName))return;if(e.code==="Space"||e.key==="Enter"){e.preventDefault();markNow()}else if(e.key==="p"||e.key==="P"){e.preventDefault();toggle()}else if(e.key==="Backspace"){e.preventDefault();undo()}});
function tick(){const t=audio.currentTime||0;$("#seek").value=t;$("#time").textContent=`${fmt(t)} / 4:35.04`;requestAnimationFrame(tick)}audio.addEventListener("ended",()=>$("#play").textContent="▶ 再生");render();syncNext();tick();
})();
</script>
</body>
</html>
