<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KAVA SOUND｜自主練習</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0e223a;--text:#f5fbff;--muted:#9eb7cc;--accent:#58e5ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% 0,#1f4777,transparent 34%),radial-gradient(circle at 88% 0,#54265d,transparent 34%),var(--bg);font-family:"Yu Gothic",system-ui,sans-serif;color:var(--text)}
button,input,textarea{font:inherit}.app{width:min(1040px,100%);margin:auto;padding:10px}
.back{display:inline-block;color:#a4ddff;text-decoration:none;margin:4px 0 8px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}
.eyebrow{margin:0;color:#a8d4f7;font-size:.72rem;letter-spacing:.15em}h1{margin:2px 0 0;font-size:clamp(1.45rem,4vw,2.25rem)}
.badge{border:1px solid #ffffff25;border-radius:999px;padding:7px 11px;background:#ffffff10;font-size:.78rem}
.card{background:linear-gradient(155deg,#0e223aef,#09192cef);border:1px solid #ffffff1c;border-radius:18px;padding:14px;margin-bottom:10px}
.title-row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.title-row h2{margin:0;font-size:1.02rem}
.small{font-size:.78rem;color:var(--muted);line-height:1.55}
.part-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.part,.mode{border:1px solid #ffffff22;background:#173451;color:white;border-radius:12px;padding:12px 7px;font-weight:800}
.part.active,.mode.active{background:linear-gradient(135deg,#00add3,#6659eb);outline:2px solid #83ebff}
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}
.transport{display:grid;grid-template-columns:auto auto auto auto 1fr auto;gap:8px;align-items:center}.transport button{border:1px solid #ffffff22;background:#163451;color:white;border-radius:11px;padding:10px 12px}.transport .primary{background:linear-gradient(135deg,#00b8dc,#695cff);font-weight:900}
input[type=range]{width:100%;accent-color:var(--accent)}.time{min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
.speed{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}.speed button{border:1px solid #ffffff1e;background:#132d48;color:#dcecff;border-radius:999px;padding:6px 10px}.speed button.active{outline:2px solid #65e5ff}
.loop{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:9px}.loop button{border:1px solid #ffffff20;background:#153450;color:white;border-radius:11px;padding:10px}.loop button.on{background:#245f42;outline:2px solid #77f1ad}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;border:1px solid #ffffff22;background:#132c48;color:white;border-radius:11px;padding:10px}.tabs button.active{background:#24526e;outline:2px solid #61dfff}
.viewer{background:#e9edf1;border-radius:12px;overflow:auto;max-height:66vh;text-align:center;padding:8px}.viewer img{display:block;margin:auto;max-width:100%;height:auto;transition:width .15s}
.viewer-controls{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}.viewer-controls button{border:1px solid #ffffff20;background:#173451;color:white;border-radius:10px;padding:8px 11px}
.record-box{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}.record-box button{border:1px solid #ffffff22;background:#173451;color:white;border-radius:12px;padding:11px}.record{background:#7b2940!important}.record.recording{background:#a41e3f!important;outline:3px solid #ff8da2}
.record-result{display:none;margin-top:10px}.record-result.show{display:block}.record-result audio{width:100%}.record-result a{color:#9deaff}
.status{padding:9px 11px;border-radius:11px;background:#071a2c;color:#cde1ef;margin-top:9px}
.memo{width:100%;min-height:80px;background:#06172a;color:white;border:1px solid #ffffff22;border-radius:11px;padding:10px}
.beta-note{margin-top:8px;padding:9px 11px;background:#2b2515;border:1px solid #ffd66b33;border-radius:11px;color:#ffe8aa;font-size:.8rem;line-height:1.55}
@media(max-width:680px){.badge{display:none}.part-grid{grid-template-columns:1fr}.mode-grid{grid-template-columns:1fr 1fr}.transport{grid-template-columns:auto auto auto auto 1fr}.time{grid-column:1/-1;text-align:center}.record-box{grid-template-columns:1fr}.viewer{max-height:58vh}}
</style>
</head>
<body>
<main class="app">
<a class="back" href="../">← KAVA SOUND メニューへ</a>
<header class="hero">
<div><p class="eyebrow">KAVA SOUND / PRACTICE BETA</p><h1>自主練習</h1></div>
<span class="badge">分離音源β</span>
</header>

<section class="card">
<div class="title-row"><h2>① 自分のパート</h2><span id="partLabel" class="small">ソプラノ</span></div>
<div class="part-grid">
<button class="part active" data-part="soprano">ソプラノ</button>
<button class="part" data-part="alto">アルト</button>
<button class="part" data-part="tenor">男声</button>
</div>
<div class="mode-grid">
<button class="mode active" data-mode="part">🎧 パートだけ<br><span class="small">分離ガイド音</span></button>
<button class="mode" data-mode="accompaniment">🎹 伴奏だけ<br><span class="small">歌なし練習</span></button>
<button class="mode" data-mode="mix">🎤 パート＋伴奏<br><span class="small">実戦練習</span></button>
<button class="mode" data-mode="chorus">👥 合唱確認<br><span class="small">完成イメージ</span></button>
</div>
<div class="beta-note">分離音源はβ版です。伴奏や別パートが少し残る場所があれば、そこも今後調整します。</div>
</section>

<section class="card">
<div class="title-row"><h2>② 再生・繰り返し</h2><span class="small">イヤホン推奨</span></div>
<div class="transport">
<button id="back5">−5秒</button><button id="play" class="primary">▶ 再生</button><button id="stop">■</button><button id="forward5">＋5秒</button>
<input id="seek" type="range" min="0" max="275.043" step="0.01" value="0"><span class="time" id="time">0:00 / 4:35</span>
</div>
<div class="speed"><span class="small">速度</span>
<button data-speed=".75">0.75</button><button data-speed=".9">0.9</button><button class="active" data-speed="1">1.0</button><button data-speed="1.1">1.1</button>
</div>
<div class="loop"><button id="setA">A：<strong id="aText">未設定</strong></button><button id="setB">B：<strong id="bText">未設定</strong></button><button id="loopBtn">ループ OFF</button></div>
</section>

<section class="card">
<div class="title-row"><h2>③ 楽譜・歌詞</h2><span class="small">拡大できます</span></div>
<div class="tabs"><button id="scoreTab" class="active">🎼 楽譜</button><button id="lyricsTab">📝 歌詞</button></div>
<div class="viewer"><img id="sheet" src="../score/page01.jpg" alt="楽譜"></div>
<div class="viewer-controls" id="scoreControls"><button id="prevPage">← 前</button><strong id="pageLabel">1 / 8</strong><button id="nextPage">次 →</button><button id="zoomOut">−</button><button id="zoomIn">＋</button></div>
</section>

<section class="card">
<div class="title-row"><h2>④ 自分の歌を録音して聴く</h2><span class="small">端末内のみ</span></div>
<div class="record-box"><div class="small">今選んでいる練習モードを再生しながら録音します。</div><button id="recordBtn" class="record">● 録音＋再生</button><button id="recordStop" disabled>■ 録音停止</button></div>
<div id="recordStatus" class="status">録音待機中</div>
<div id="recordResult" class="record-result"><audio id="recordPlayback" controls></audio><br><a id="downloadRecording">録音を保存</a></div>
</section>

<section class="card">
<div class="title-row"><h2>⑤ 今日の練習メモ</h2><span class="small">この端末に保存</span></div>
<textarea id="memo" class="memo" placeholder="例：サビ前を伴奏だけで歌うとまだ不安。"></textarea>
</section>
</main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const labels={soprano:"ソプラノ",alto:"アルト",tenor:"男声"};
const tracks={
  soprano:new Audio("../audio_sep/soprano_only.mp3"),
  alto:new Audio("../audio_sep/alto_only.mp3"),
  tenor:new Audio("../audio_sep/tenor_only.mp3"),
  accompaniment:new Audio("../audio_sep/accompaniment_only.mp3"),
  chorus:new Audio("../audio/chorus.mp3")
};
let part="soprano",mode="part",speed=1,playing=false,loopA=null,loopB=null,loopOn=false,syncTimer=null;
function ref(){return mode==="accompaniment"?tracks.accompaniment:mode==="chorus"?tracks.chorus:tracks[part]}
function activeNames(){if(mode==="part")return[part];if(mode==="accompaniment")return["accompaniment"];if(mode==="mix")return[part,"accompaniment"];return["chorus"]}
const fmt=t=>`${Math.floor((t||0)/60)}:${Math.floor((t||0)%60).toString().padStart(2,"0")}`;
function pauseAll(){Object.values(tracks).forEach(x=>x.pause());playing=false;$("#play").textContent="▶ 再生";if(syncTimer){clearInterval(syncTimer);syncTimer=null}}
function setTime(t){Object.values(tracks).forEach(x=>{try{x.currentTime=t}catch(e){}})}
function applyRate(){Object.values(tracks).forEach(x=>x.playbackRate=speed)}
function applyVolume(){Object.values(tracks).forEach(x=>x.volume=1);if(mode==="mix"){tracks[part].volume=.78;tracks.accompaniment.volume=.9}}
async function playAll(){pauseAll();applyRate();applyVolume();const t=ref().currentTime;setTime(t);const names=activeNames();await Promise.allSettled(names.map(n=>tracks[n].play()));playing=true;$("#play").textContent="❚❚ 一時停止";syncTimer=setInterval(()=>{const r=ref().currentTime;names.forEach(n=>{if(Math.abs(tracks[n].currentTime-r)>.07)tracks[n].currentTime=r})},700)}
function stopAll(){pauseAll();setTime(0)}

$$(".part").forEach(b=>b.onclick=()=>{const t=ref().currentTime;pauseAll();part=b.dataset.part;$$(".part").forEach(x=>x.classList.toggle("active",x===b));$("#partLabel").textContent=labels[part];setTime(t)});
$$(".mode").forEach(b=>b.onclick=()=>{const t=ref().currentTime;pauseAll();mode=b.dataset.mode;$$(".mode").forEach(x=>x.classList.toggle("active",x===b));setTime(t)});
$("#play").onclick=()=>playing?pauseAll():playAll();$("#stop").onclick=stopAll;$("#back5").onclick=()=>setTime(Math.max(0,ref().currentTime-5));$("#forward5").onclick=()=>setTime(Math.min(ref().duration||275,ref().currentTime+5));$("#seek").oninput=()=>setTime(Number($("#seek").value));
$$(".speed button").forEach(b=>b.onclick=()=>{speed=Number(b.dataset.speed);applyRate();$$(".speed button").forEach(x=>x.classList.toggle("active",x===b))});
$("#setA").onclick=()=>{loopA=ref().currentTime;$("#aText").textContent=fmt(loopA)};$("#setB").onclick=()=>{loopB=ref().currentTime;$("#bText").textContent=fmt(loopB)};
$("#loopBtn").onclick=()=>{if(loopA==null||loopB==null||loopB<=loopA){alert("AとBを順番に設定してください");return}loopOn=!loopOn;$("#loopBtn").textContent=loopOn?"ループ ON":"ループ OFF";$("#loopBtn").classList.toggle("on",loopOn)};

let page=1,zoom=100,showLyrics=false;
function showSheet(){if(showLyrics){$("#sheet").src="../score/lyrics.jpg";$("#scoreControls").style.display="none"}else{$("#sheet").src=`../score/page${String(page).padStart(2,"0")}.jpg`;$("#pageLabel").textContent=`${page} / 8`;$("#scoreControls").style.display="flex"}$("#sheet").style.width=zoom+"%"}
$("#scoreTab").onclick=()=>{showLyrics=false;$("#scoreTab").classList.add("active");$("#lyricsTab").classList.remove("active");showSheet()};$("#lyricsTab").onclick=()=>{showLyrics=true;$("#lyricsTab").classList.add("active");$("#scoreTab").classList.remove("active");showSheet()};
$("#prevPage").onclick=()=>{page=Math.max(1,page-1);showSheet()};$("#nextPage").onclick=()=>{page=Math.min(8,page+1);showSheet()};$("#zoomIn").onclick=()=>{zoom=Math.min(180,zoom+20);showSheet()};$("#zoomOut").onclick=()=>{zoom=Math.max(80,zoom-20);showSheet()};

let mr=null,chunks=[],recordUrl=null;
$("#recordBtn").onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});chunks=[];mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mr.onstop=()=>{const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=URL.createObjectURL(blob);$("#recordPlayback").src=recordUrl;$("#downloadRecording").href=recordUrl;$("#downloadRecording").download="KAVA_SOUND_recording.webm";$("#recordResult").classList.add("show");stream.getTracks().forEach(t=>t.stop());$("#recordStatus").textContent="録音完了。聴き返してみよう。"};mr.start(250);$("#recordBtn").disabled=true;$("#recordStop").disabled=false;$("#recordBtn").classList.add("recording");$("#recordStatus").textContent="録音中…";await playAll()}catch(e){$("#recordStatus").textContent="マイクを開始できません。マイク許可を確認してください。"}};
$("#recordStop").onclick=()=>{if(mr&&mr.state!=="inactive")mr.stop();pauseAll();$("#recordBtn").disabled=false;$("#recordStop").disabled=true;$("#recordBtn").classList.remove("recording")};

const memoKey="kava_sound_practice_memo";$("#memo").value=localStorage.getItem(memoKey)||"";$("#memo").oninput=()=>localStorage.setItem(memoKey,$("#memo").value);
function loopUI(){const t=ref().currentTime||0;if(!$("#seek").matches(":active"))$("#seek").value=t;$("#time").textContent=`${fmt(t)} / 4:35`;if(loopOn&&loopA!=null&&loopB!=null&&t>=loopB)setTime(loopA);requestAnimationFrame(loopUI)}showSheet();loopUI();
</script>
</body>
</html>
